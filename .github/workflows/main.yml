name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin' # استبدال الموزع لنسخة أكثر استقراراً مع أندرويد
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.x' # تحديد إصدار مستقر يمنع تضارب الـ AGP 9 الجديد
        channel: 'stable'

    - name: Repair and Create Android Files
      run: flutter create --platforms=android .

    - name: Install dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release --no-shrink

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: accounting-ledger-release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
